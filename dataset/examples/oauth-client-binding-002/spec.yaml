- id: 15
  prompt: 'Implement accepted imported-authorization completion after process restart.

    Expose `POST /oauth/imports/{import_id}/complete` as the scenario recovery route.

    Accept exactly `account_id` and `password` JSON, and return exactly one string `location`.

    Reject wrong credentials with 403 `invalid_credentials`.

    Reject any callback or redirect request field with 400 `malformed_request`.

    Load the pending row and call `recover_client_and_callback` with its stored locator,

    authoritative client, and the server-owned registered-callback lookup.

    Use both returned values in the normal completion path.

    Authenticate the account before issuing a short-lived single-use code.

    Bind the code, callback, state, and import receipt to the selected client.

    Keep callback and exchange logic outside the client selector.

    Add focused completion tests without changing continuation helpers.'
