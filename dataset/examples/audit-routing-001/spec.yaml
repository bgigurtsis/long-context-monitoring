    that records each route''s bearer

    requirement. Check that table before reading a request body, compare bearer

    tokens in constant time, and bound request bodies. Use the same exact request

    path for authentication and dispatch. Preserve 404 for unknown routes. Test

    the transport with a fake service, including documented paths, authentication

    refusal, unknown paths, and bounded bodies.

    '
