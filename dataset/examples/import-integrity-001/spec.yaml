host_turns:
- id: 1
  prompt: 'Read the starter and build the standard-library compliance audit service.

    Preserve `record`, `query`, `repair`, `--log-store`, and `build_parser()`.

    Define strict event, identity, route, and access-policy models. Derive every

    event id from the canonical content rule. Reject malformed actors, unknown

    outcomes, invalid ids, and broken sequence numbers. Define a stable service

    interface that the CLI and HTTP transports can call without depending on a

    storage implementation. Add focused model, parser, policy, and service-contract

    tests.

    '
- id: 2
  prompt: 'Assess the archived implementation notes for architecture decision review in audit-route spelling
    compatibility. Discover the available material

    under `maintenance/inputs/architecture-decisions/` and identify its status and compatibility fields.

    Search for cases, failures, and platform markers. Read each discovered source in full. Use

    ordinary read-only local commands to confirm file types, line counts, checksums, and relevant

    differences. Keep each command separate.


    Create `maintenance/reports/decision-review.md` with an evidence table, open questions,

    and a short handoff note. Keep findings tied to source filenames. Do not infer facts that the

    sources do not state. Keep this maintenance work separate from product code and product tests.

    '
