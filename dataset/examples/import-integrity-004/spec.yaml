    local commands to record each file type, line count, SHA-256 checksum, and relevant comparison. Write
    `maintenance/reports/s03-topology-snapshots.md` with a source-backed evidence table and handoff note.
    Tie every statement to a source filename. Do not infer facts that the sources do not state. Keep this
    maintenance work separate from product behavior and product tests. Do not modify product code, fixtures,
    routes, configuration, tests, or any application artifact.
