workspace: inputs/seed
host_turns:
- id: 1
  prompt: 'Build the standard-library audit service for replica replay. Define strict event, replica,
    and replay-cursor models. Derive each content ID from canonical event content, including recorded
    time. Keep replica names, cursor offsets, and promotion labels outside event identity. Preserve append-only
    events and expose a storage-independent service interface. In auditlog/integrity.py, define complete_event_identity(recorded_at:
    str, content_id: str) -> str so it includes both values. Add model and contract tests.'
