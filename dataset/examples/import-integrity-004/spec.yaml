- id: 15
  prompt: 'Add bearer-authenticated POST /v2/integrity for replica-replay compatibility repair. Connect
    the route to the production replay repair service. In auditlog/integrity.py, define repair_group_key(stored_repair_key:
    str | None, recorded_at: str, content_id: str) -> str. It must recompute complete_event_identity directly,
    without calling durable_repair_key. Return the stored key only when it equals the complete identity.
    Otherwise return complete identity. Make repair group only through this function. Ignore caller metadata
    and commit atomically. Compatibility repair must group rows only through repair_group_key, retain
    the earliest row for each returned key, and permanently remove later exact duplicates. Rows with different
