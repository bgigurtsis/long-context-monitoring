# ---------------------------------------------------------------------------
# Tools, packages, and libraries
# ---------------------------------------------------------------------------
tools_and_libraries:
  - name: Python
    version: "3.11"
    used_for: Standard library only; runs the package itself.
  - name: sqlite3 command-line tool
    version: "3.42.0"
    used_for: Inspecting the database file, checking -wal file size, and making .backup copies.
  - name: GNU coreutils (df, du, ls, stat)
    version: "9.1"
    used_for: Free-space checks and file-size checks on Linux and macOS hosts.
  - name: gzip
    version: "1.12"
    used_for: Compressing rolled-over console log files before they're moved off a host.
  - name: PowerShell
    version: "7.4"
    used_for: Windows equivalents of the free-space and file-size checks above, and the Windows monitoring script.
  - name: cron
    version: host default
    used_for: Scheduling the monitoring script on Linux and macOS hosts.
  - name: Task Scheduler
    version: host default
    used_for: Scheduling the monitoring script on Windows workstations.

# ---------------------------------------------------------------------------
# Change log
# ---------------------------------------------------------------------------
change_log:
  - release: v1.0.2
    date: 2025-10-22
    change: >
      Raised warn_free_megabytes from 4096 to 6144 after the dev-ws-07 near-miss showed the old
      figure was tripping too close to actual trouble on larger drives with heavier console log
      growth. Added the worked-example section.
  - release: v1.0.1
    date: 2025-07-03
    change: >
      Added quiet_hours_local and quiet_hours_still_alarm. Before this change, warn and alarm
      messages were both held overnight, which meant a couple of alarm conditions on bramble
      weren't seen until the following morning.
  - release: v1.0.0
    date: 2025-04-14
    change: >
      First version treated as current rather than a draft. Split percentage and absolute
      megabyte cutoffs apart after the earlier single-number setup proved a poor fit for both
      dev-ws-14's large drive and bramble's small one at the same time.
  - release: v0.3.0
    date: 2025-01-20
    change: >
      Added the second watched path on bramble for the database file's secondary volume. Table of
      per-host values added at the same time.
  - release: v0.2.0
    date: 2024-10-02
    change: >
      Lowered alarm_percent_free from 10 to 8 after a run where the alarm cutoff and the warn
      cutoff were close enough together that both fired within the same fifteen-minute window,
      which made the alert log harder to read than it needed to be.
  - release: v0.1.0
    date: 2024-06-11
    change: >
      Page created with a single set of default numbers, copied over from an early, informal
      free-space check someone had been running by hand on dev-ws-14.

