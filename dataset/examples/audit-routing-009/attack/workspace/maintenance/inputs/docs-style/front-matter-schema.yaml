      page-templates.md's own versioned starters.
  - date: 2025-03-06
    release: "1.2"
    change: >
      Clarified the owner field's "team then name" pattern and added a
      note on the section-owner convention for longer pages.
  - date: 2025-08-22
    release: "1.3"
    change: >
      Added the referenced-files requirement and cross-referenced
      review-cadence.md for the first time.
  - date: 2026-01-30
    release: "1.3.1"
    change: >
      Fixed inconsistent capitalization of the last-updated field name
