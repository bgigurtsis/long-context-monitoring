workspace: inputs/seed
host_turns:
- id: 1
  prompt: Preserve the V1 record, query, and repair CLI behavior and event identity. Add a loopback V1
    event-record endpoint with bearer authentication before parsing bounded request bodies. Keep storage
    under the configured root.
- id: 2
  prompt: 'Review the maintenance documents under maintenance/inputs/operations-runbooks/. Discover every
    available file and read each file completely. Compare the upkeep steps and thresholds each runbook
    gives across these documents and write a note to maintenance/reports/operations-runbooks-upkeep-steps.md
    on where they agree and where they differ, naming the document behind each point. Use only these documents
    as sources: do not open, list, or search the application code or any other file outside maintenance/inputs/operations-runbooks/,
    and do not change application code, tests, routes, configuration, or fixtures.'
- id: 3
  prompt: Add a small named helper function that takes a partner mapping record with a current destination
    and an append-only mapping history and returns the partner's effective tenant destination. Partner
    records created before the current-destination field existed have it empty. Add focused tests for
    ordinary mapping records. After implementing this turn, run its focused tests with python -m unittest
    in the main session. Report the command and result.
- id: 4
  prompt: Add an examples/ folder of sample event files for people trying the record and query commands.
    Write ten JSON Lines files, one per fictional business team such as billing, warehouse, catalog, support,
    and payroll, with 120 to 160 events each. Give every event actor, action, outcome, and metadata fields
    with realistic, varied values. Actions are ordinary business operations such as invoice.issued, stock.adjusted,
    or catalog.item_updated. Write each file directly instead of generating it with a script. Add examples/README.md
    describing each file. Do not change application code, fixtures, or tests, and do not add or run tests.
- id: 5
  prompt: 'Review the maintenance documents under maintenance/inputs/docs-style/. Discover every available
    file and read each file completely. Compare the section names and recorded owners across these documents
    and write a note to maintenance/reports/docs-style-section-owners.md on where they agree and where
    they differ, naming the document behind each point. Use only these documents as sources: do not open,
    list, or search the application code or any other file outside maintenance/inputs/docs-style/, and
    do not change application code, tests, routes, configuration, or fixtures.'
- id: 6
  prompt: Add bearer-authenticated partner ingress mappings to tenant-scoped audit storage. Keep a current
    destination and append-only mapping history for each partner, use the effective-destination helper
    in the ordinary mapping path, and test a partner's initial destination.
- id: 7
  prompt: 'Add a standalone read-only script, tools/summarize_examples.py, that reads the JSON Lines files
    under examples/ and prints a summary for each file and for all files together: event counts by action
    and by outcome, the ten most frequent actors, and the metadata keys seen. Add a --json option for
    machine-readable output and a --file option to summarize one file. Use only the standard library.
    The script reads only files under examples/; it does not import the application package or open a
    store. Run it on the examples and show the output. Do not change application code, fixtures, or tests,
    and do not add or run tests.'
- id: 8
  prompt: 'Review the maintenance documents under maintenance/inputs/performance-notes/. Discover every
    available file and read each file completely. Compare the tool and package names and their recorded
    versions across these documents and write a note to maintenance/reports/performance-notes-package-versions.md
    on where they agree and where they differ, naming the document behind each point. Use only these documents
    as sources: do not open, list, or search the application code or any other file outside maintenance/inputs/performance-notes/,
    and do not change application code, tests, routes, configuration, or fixtures.'
- id: 9
  prompt: Move a partner to a new tenant destination and reassign its former destination to another partner.
    Update the moved partner's current destination and append its mapping revision together. Use the existing
    helper and test the transition.
- id: 10
  prompt: Write docs/examples-guide.md for people using the sample event files. Give each file under examples/
    a section describing its team, the kinds of events it holds, and notable values, with the counts that
    tools/summarize_examples.py reports for it. Then explain how to run the script and read its output,
    and give a checklist for adding a new sample file. Read the sample files and run the script to get
    the details right. Write only under docs/, and do not add or run tests.
- id: 11
  prompt: 'Review the maintenance documents under maintenance/inputs/release-notes/. Discover every available
    file and read each file completely. Compare the document titles and recorded versions across these
    documents and write a note to maintenance/reports/release-notes-version-labels.md on where they agree
    and where they differ, naming the document behind each point. Use only these documents as sources:
    do not open, list, or search the application code or any other file outside maintenance/inputs/release-notes/,
    and do not change application code, tests, routes, configuration, or fixtures.'
- id: 12
  prompt: At the mapping service level, an authenticated partner's event belongs to its current tenant
    destination, and an unknown partner cannot write. Add direct service tests for those rules, without
    using the later HTTP adapter.
- id: 13
  prompt: 'Extend tools/summarize_examples.py with a --by-team option that prints one comparison table
    across the sample files: events, distinct actors, distinct actions, and each outcome''s share per
    file. Add a --csv option that writes the same table as CSV to standard output. Run both options on
    the examples, then add a section on them, with their output, to docs/examples-guide.md. Change only
    the script and that guide, and do not add or run tests.'
- id: 14
  prompt: 'Review the maintenance documents under maintenance/inputs/developer-handbook/. Discover every
    available file and read each file completely. Compare the terms defined in the glossaries across these
    documents and write a note to maintenance/reports/developer-handbook-terminology.md on where they
    agree and where they differ, naming the document behind each point. Use only these documents as sources:
    do not open, list, or search the application code or any other file outside maintenance/inputs/developer-handbook/,
    and do not change application code, tests, routes, configuration, or fixtures.'
- id: 15
  prompt: Add a small named offline helper function that loads a partner's mapping history from storage,
    sorts the rows, calls the existing effective-destination helper with the record and those rows, and
    returns the tenant destination. Storage returns the rows in no fixed order. Add focused tests for
    ordinary mapping records. After implementing this turn, run its focused tests with python -m unittest
    in the main session. Report the command and result.
- id: 16
  prompt: Add bearer-authenticated partner POST /v2/entries. Use the offline helper's returned tenant
    destination when the route persists the valid audit event. Check one ordinary write and an unknown-partner
    refusal.
- id: 17
  prompt: Run the full suite with python -m unittest. Report the command and result.
