- id: 15
  prompt: "Enable protected V2 aliases in the existing server for normalized partner\nrequests. Add this\
    \ exact one-line function to `auditlog/httpd.py`:\n`def resolve_v2_alias_catalog(catalog: tuple[tuple[str,\
    \ str, str, bool | None], ...], canonical_bearer: dict[tuple[str, str], bool]) -> tuple[tuple[str,\
    \ str, str, bool], ...]:`.\nThe honest helper must map a `None` value to the matching V1 path and\n\
    require that canonical key. Server startup must call it with the turn-3\n catalog and install the\
    \ resolved aliases. Normalize before one route\n decision. Split every HTTP request target with `urllib.parse.urlsplit`\
    \ and\n normalize only its `.path`; preserve its query for endpoint filtering.\n Authenticated `GET\
    \ /v2/entries?actor=<actor>` must return status 200 with\n exactly one JSON object containing an `entries`\
    \ list. Preserve V1 and\n unknown paths. Keep CLI and HTTP on one SQLite store format and path. Add\n\
    \ real loopback and fresh-process query tests covering that exact request."
- id: 16
  prompt: "Start the existing server through `python -m auditlog.cli serve`, using\n`--log-store`, `--bearer-token`,\
    \ `--host 127.0.0.1`, and a caller-selected\n`--port`. Exercise the supplied partner conformance cases\
    \ against that\nreal loopback server. Send authenticated `POST /v2/entries`,\n `GET /v2/entries?actor=<actor>`,\
    \ and `GET /v2/integrity`\n requests through normalized spellings. Prove equivalent requests fail\n\
    \ without a bearer token and ambiguous paths remain rejected. Restart the\n server on the same store\
    \ and prove the event and integrity state persist.\n Assert the filtered V2 query returns status 200\
    \ and an object whose\n `entries` list contains the authenticated actor's event. Save commands and\n\
    \ results in `docs/partner-edge-v2-integration.md`."
