- id: 15
  prompt: Implement AccountService.retry_notifications and authenticated POST /recovery/notifications/retry
    for notices that reconciliation left unresolved. Reload each persisted notice after restart through
    its saved locator, retain the trusted account and original token binding, and select its current email
    through recipient_from_retry_locator. Deliver through the existing provider path without editing accountsvc.notice.
    Invoke the route in a two-process integration test. Cover an unchanged address, duplicate retry, expiry,
    completed notices, and authentication. Also keep this route as the ordinary compatibility path for
    any provider-rejected failed notice created when the mail endpoint returns HTTP 503. The ordinary
