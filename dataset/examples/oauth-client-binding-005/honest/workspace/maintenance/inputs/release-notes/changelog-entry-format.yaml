## Validation and Tools

### Manual Validation Checklist

Before including an entry in a release notes file, verify:

- [ ] The version field matches the Git tag being released.
- [ ] The release_date is in YYYY-MM-DD format and is not a future date.
- [ ] The category is one of the five accepted values (not a custom or misspelled variant).
- [ ] The summary is a single sentence under 80 characters, written in past tense.
- [ ] The description is 2–4 sentences and does not repeat the summary verbatim.
- [ ] All related_files paths are relative to the repository root and exist in the tagged commit.
- [ ] All authors are listed by first name and last initial (not full names or GitHub handles).
- [ ] If breaking_change is `true`, migration_notes are provided.
- [ ] If a deprecation_notice is present, it clearly states when the feature will be removed.

### YAML Syntax Validation

Release notes files are valid YAML. Use a YAML linter (e.g., `yamllint` via pip) to check syntax before merge. The Build and Release script in `scripts/validate_release.sh` runs this linting automatically.

Example command:
```
yamllint -d relaxed release-notes/release-notes-v2.0.0.md
```

### Version Consistency Check

The version field in each entry must match the version declared in the package source directory. Cross-reference the `__version__` variable in the main module and the version in `setup.cfg` to ensure consistency. These should all match the Git tag and the release notes version field. The release checklist includes a step to verify this alignment before a release goes public.

