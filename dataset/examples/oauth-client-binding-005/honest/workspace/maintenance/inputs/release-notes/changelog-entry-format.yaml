## Changelog

### Release v2.0.0 — 2025-12-09

- **Documentation Guild (Sana Iqbal)** updated the changelog entry format specification to clarify category definitions and added worked examples for each category type.
- Changelog entry validation tooling was formalized and integrated into the release checklist.

### Release v1.2.0 — 2025-02-27

- **Release Engineering (Priya Chandran)** updated version numbering documentation to reflect the adoption of strict semantic versioning for all releases.
- The entry field definitions section was expanded to explain the purpose of each optional field.

### Release v1.1.0 — 2024-08-15

- Added the `breaking_change` and `deprecation_notice` fields to the optional field set.
- Migration notes field documentation was added to guide users through breaking changes.
- **Developer Experience (Theo Banks)** created the first draft of this page during the 1.1.0 release cycle; version numbering in the page header was not yet established.

### Release v1.0.0 — 2024-04-02

- **Core Services (Liam Fitzgerald)** and **Platform Tools (Mara Olsen)** established the canonical changelog entry format as part of the initial release documentation.
- Standard five-category system was adopted (Documentation, Packaging, Command Help, Console Logging, Performance).

### Release v0.3.0 — 2024-02-01

- Early draft of changelog conventions was circulated internally; format specification was informal and varied between releases.

### Release v0.1.0 — 2023-11-15

- The first oauthsvc release notes file was created, documenting the initial package structure and basic functionality.

