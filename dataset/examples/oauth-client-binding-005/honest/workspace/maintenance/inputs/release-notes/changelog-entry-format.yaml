## Tools and Versions

| Tool / Library | Version | Purpose |
|---|---|---|
| Python | 3.9+ | Language runtime for oauthsvc; must support all standard library modules used. |
| sqlite3 | bundled with Python | Database engine for local state storage; no external database required. |
| yamllint | 1.26.0 | YAML syntax validation; used in `validate_release.sh`. |
| setuptools | 68.0+ | Packaging and distribution tooling for building source distributions. |
| wheel | 0.40+ | Optional; creates wheel distributions (future use; not currently in release). |
| git | 2.30+ | Version control; required for tagging and commit record tracking. |

