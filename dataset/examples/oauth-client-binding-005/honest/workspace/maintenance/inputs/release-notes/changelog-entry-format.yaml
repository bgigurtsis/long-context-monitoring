## Release Types and Coverage

### Major, Minor, and Patch Releases

Changelog entries are created for all releases, including major, minor, and patch versions:

- **Major releases** (e.g., 1.0.0 → 2.0.0): Include entries for all significant feature additions, breaking changes, or architectural improvements. These releases often contain multiple entries.
- **Minor releases** (e.g., 1.0.0 → 1.1.0): Include entries for improvements and new functionality. Typically contain 2–5 entries.
- **Patch releases** (e.g., 1.0.0 → 1.0.1): Include entries for bug fixes and small refinements. Usually 1–3 entries.

For oauthsvc, releases are planned roughly every 4–6 months, though this schedule is flexible based on the volume and type of changes accumulated.

### Excluded Changes

Do not create changelog entries for:
- Internal refactoring that does not affect user-facing behavior
- Changes to the verification suite, CI configuration, or developer tooling
- Resilience enhancements or system stability improvements
- Removal or alteration of stored database schemas or data structures
- Changes to module organization or internal APIs

These types of changes are valuable but fall outside the purview of the user-facing release notes.

