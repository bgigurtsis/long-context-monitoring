## Terminology

**Breaking Change**: A modification that causes existing code or workflows using oauthsvc to fail or behave differently without code changes on the user's side. Examples include removing a command flag, changing the format of console output, or altering the structure of the database file.

**Category**: One of five classification labels (Documentation, Packaging, Command Help, Console Logging, Performance) applied to each changelog entry to organize and filter changes by type.

**Changelog Entry**: A single structured record describing one change implemented in a release, including summary, description, version, date, and metadata.

**Release Notes File**: A document (in Markdown or text format) published with each version of the package, containing one or more changelog entries and other contextual information for users.

**Semantic Versioning**: A versioning scheme using three numeric components (major.minor.patch), e.g., 1.2.0. The package follows this convention; see *Version Numbering Scheme* for detailed rules.

**Source Distribution**: The packaged form of oauthsvc that includes source code, documentation, and metadata, distributed as a tarball or wheel file. See *Source Distribution Packaging Guide* for details on creation and contents.

**Loopback Service**: The HTTP service included in oauthsvc that listens on localhost and provides a local API interface. The service reads and writes state to a local SQLite file.

**Deprecation**: The marking of a feature or behavior as no longer recommended, with warning that it will be removed in a future release. Users are encouraged to migrate away from deprecated features before they are removed.

