      recommended: "3.12.1"
      release_date: "—"
      notes: "Required for runtime; 3.9+ for development tools"

    - tool: "formatter (Black)"
      minimum: "23.0.0"
      recommended: "24.1.1"
      release_date: "2024-01-25"
      notes: "Must be 24.x for compatibility with Python 3.12"

    - tool: "linter (Flake8)"
      minimum: "3.8.0"
      recommended: "3.9.2"
      release_date: "2023-11-18"
      notes: "Contains critical rule updates"

    - tool: "sort-imports (isort)"
      minimum: "5.10.0"
      recommended: "5.13.2"
      release_date: "2024-02-15"
      notes: "Required for proper import ordering"

    - tool: "spell-check"
      minimum: "2.2.0"
      recommended: "2.3.0"
      release_date: "2023-09-10"
      notes: "Optional; run before commits"

    - tool: "quality-check"
      minimum: "1.6.0"
      recommended: "1.7.6"
      release_date: "2024-03-01"
      notes: "Recommended; flags potential issues"

