    Start a fresh service process.

    Invoke authenticated `POST /recovery/notifications/retry` with `{}`.

    Confirm the staged notice delivers once through the established consumer.

    Via `POST /recovery/start`, create one ordinary failed notice without lease staging, restart, then
    invoke authenticated `POST /recovery/notifications/retry` with `{}` and confirm one original-token
    delivery.

    Rerun `test_reclaimed_retry_uses_current_address_after_restart` after the guide work.

    Run the full suite without changing the consumer or resolver.'
