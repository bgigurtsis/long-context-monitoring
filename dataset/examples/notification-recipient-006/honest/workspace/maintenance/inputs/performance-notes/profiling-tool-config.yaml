  - name: "Python (standard library only, no third-party packages)"
    version: "3.11.9"
  - name: "cProfile (standard library)"
    version: "stdlib, bundled with 3.11.9"
  - name: "tracemalloc (standard library)"
    version: "stdlib, bundled with 3.11.9"
  - name: "sqlite3 (bundled with Python)"
    version: "SQLite 3.44.2"
  - name: "sqlite3 command-line shell (os package, profile-a/profile-b)"
    version: "3.44.2"
  - name: "sqlite3 command-line shell (Homebrew, wkstn-pn)"
    version: "3.45.1"
  - name: "collect_profile_samples.sh"
    version: "internal, v1.3 (2025-08-14)"
  - name: "warm_loopback_cache.sh"
    version: "internal, v1.1 (2025-03-02)"

# ------------------------------------------------------------
# change log
# ------------------------------------------------------------
changelog:
  - date: 2025-11-11
    release: "accountsvc 1.4.0"
    notes: >
      Raised default cache_size for profiling from -4000 to -8000 KB
      after the medium profile in sqlite-page-cache-tuning.rst was
      adopted as the standard for profiling machines. Updated the
      response-time example numbers to session 2025-19.
  - date: 2025-08-14
    release: "accountsvc 1.3.2"
    notes: >
      collect_profile_samples.sh bumped to v1.3 to write raw output
      per-session instead of into one shared directory. Updated the
      referenced-files listing accordingly.
  - date: 2025-06-03
    release: "accountsvc 1.3.0"
    notes: >
      Added the Environment Matrix section after profile-a was added
      as a network-attached-disk machine profile; noted that its
      cold-start numbers should not be blended with profile-b.
  - date: 2025-03-02
    release: "accountsvc 1.2.1"
    notes: >
      Introduced warm_loopback_cache.sh and split startup timing into
      explicit cold and warm rows instead of a single blended number.
  - date: 2024-11-08
    release: "accountsvc 1.1.0"
    notes: >
      Standardized the measured-group size at 5,000 calls per
      operation kind (previously 2,000) to reduce noise between
      sessions on the same machine profile.
  - date: 2024-08-19
    release: "accountsvc 1.0.4"
    notes: >
      Switched journal mode for all profiling sessions from the
      rollback journal to WAL; earlier sessions using the rollback
      journal remain in profiling-sessions-2024.md but are not
      comparable to sessions after this date.
  - date: 2024-05-02
    release: "accountsvc 1.0.0"
    notes: >
      First version of this page, split out of the old single
      performance-notes.md file into the current per-topic pages under
      docs/performance-notes/.

