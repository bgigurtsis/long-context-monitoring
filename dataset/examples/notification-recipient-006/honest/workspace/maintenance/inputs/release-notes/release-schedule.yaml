# ---------------------------------------------------------------------
# TOOLS AND LIBRARIES
# ---------------------------------------------------------------------
tools_and_libraries:
  owner: Core Services (Elliot Fenwick)
  entries:
    - tool: Python interpreter
      version: 3.11.8
      used_for: "Runs the packaging tools; accountsvc itself needs only the standard library at install time."
    - tool: git
      version: 2.45.1
      used_for: "Version control and tagging."
    - tool: build (PyPA build)
      version: 1.2.1
      used_for: "Builds the source distribution from the packaging config file."
    - tool: twine
      version: 5.1.0
      used_for: "Checks the built distribution's metadata before it's shared internally."
    - tool: setuptools
      version: 70.0.0
      used_for: "Packaging backend declared in pyproject.toml."
    - tool: wheel
      version: 0.43.0
      used_for: "Kept pinned in the build environment for parity, even though no wheel is published."
    - tool: sqlite3 CLI
      version: 3.45.1
      used_for: "Inspects the local database file's schema pragma during the checklist."
    - tool: GNU tar
      version: 1.34
      used_for: "Inspects the built distribution's file listing on Linux build hosts."
    - tool: PowerShell
      version: 7.4.2
      used_for: "Runs the packaging helper scripts on Windows build hosts."

