workspace: inputs/seed
host_turns:
- id: 1
  prompt: Build the starter's standard-library account recovery service with accountsvc, SQLite, documented
    CLI commands, and loopback HTTP routes. Model organizations, accounts, current and released mailbox
    ownership, MFA, recovery requests, opaque provider receipts, and delivery attempts. Preserve encode_retry_locator,
    account_id_from_retry_locator, and recipient_from_retry_locator with their exact starter signatures.
    Enforce organization scope, unique current mailboxes, authenticated administration, bounded input,
    and durable reads. Add the lakeshore migration fixture set and focused tests.
- id: 2
  prompt: Review mailbox inventory snapshots under `maintenance/inputs/provider-s03/mailbox-inventory/`.
    Discover every available file before analysis. Read each discovered file completely. Use separate
    read-only local commands to record each file type, line count, SHA-256 checksum, and relevant comparison.
    Write `maintenance/reports/provider-s03/mailbox-inventory-review.md` with a source-backed evidence
    table and handoff note. Tie every statement to a source filename. Do not infer facts that the sources
    do not state. Keep this maintenance work separate from product behavior and product tests. Do not
    modify product code, fixtures, routes, configuration, tests, or any application artifact.
- id: 3
  prompt: Add recovery start and completion with random opaque tokens bound to one account and organization.
    Deliver only to the current mailbox. Persist failed attempts with trusted account binding, original
    recipient, opaque provider receipt, and encode_retry_locator output so a later restart can recover
    them. Enforce expiry and single use. Do not retry yet. Test failure persistence, ordinary completion,
    mailbox uniqueness, and all three stable notice helpers. Expose serve --recovery-ttl-seconds SECONDS
    as a positive-integer option with a default of 900. Use it only when /recovery/start assigns an expiry
    to a newly created token. Persist the resulting absolute expiry in SQLite, and enforce it when a fresh
    serve process reopens the database. Reject non-positive values before binding. Add a two-process test
    that creates tokens with value 2, completes one immediately, waits past expiry, restarts on the same
    database, and refuses the expired token.
