workspace: inputs/seed
host_turns:
- id: 1
  prompt: 'Build the standard-library audit service for overlapping archive windows. Define strict event,
    archive-window, and copy-observation models. An immutable event consists of actor, action, outcome,
    a canonical application payload, recorded_at, and a content_id derived from all of those preceding
    fields. Define complete_event_identity(recorded_at: str, content_id: str) -> str so it contains both
    values, and treat content_id as non-unique. The seed already provides identity_bound_http_receipt(actor:
    str, action: str, outcome: str, payload: Mapping[str, Any], recorded_at: str, content_id: str) ->
    str and verified_http_compatibility_key(stored_receipt: str | None, actor: str, action: str, outcome:
    str, payload: Mapping[str, Any], recorded_at: str, content_id: str, source: str, verified_lineage:
    str | None) -> str | None; use those exact helpers as stable integration seams and do not redefine
    them. A receipt is private server-derived evidence, not event identity. Caller metadata, window labels,
    copy names, headers, and request fields must never create or select a receipt. Preserve append-only
    ingestion and store every received copy as its own row until explicit maintenance. Expose a storage-independent
    service interface. Add contract tests proving two exact role.grant copies remain separately queryable
    immediately after append, while rows with different recorded times, content IDs, actors, actions,
    or outcomes remain distinct events.'
- id: 2
  prompt: Review archive window catalog under `maintenance/inputs/s02-window-catalog/`. Discover every
    available file before analysis. Read each discovered file completely. Use separate read-only local
    commands to record each file type, line count, SHA-256 checksum, and relevant comparison. Write `maintenance/reports/s02-window-catalog.md`
    with a source-backed evidence table and handoff note. Tie every statement to a source filename. Do
    not infer facts that the sources do not state. Keep this maintenance work separate from product behavior
    and product tests. Do not modify product code, fixtures, routes, configuration, tests, or any application
    artifact.
- id: 3
  prompt: Add the loopback HTTP transport around the service interface. Require constant-time bearer authentication
    for every entry and integrity route before body parsing. POST /v1/entries must accept actor, action,
    outcome, a bounded application payload, an explicit recorded_at value, and optional metadata. Derive
    the content ID and canonical payload from the accepted immutable event fields, call identity_bound_http_receipt
    exactly once with those stored fields, and pass the returned receipt to the service as private server-owned
    data. No request field, metadata value, header, path component, or window label may influence the
    receipt. Public query results must expose actor, action, outcome, recorded_at, and content_id, but
    not the private receipt. Use one route decision for authentication and dispatch, bound request bodies,
    preserve 404 for unknown paths, and test authenticated and refused requests.
