- id: 15
  prompt: 'Add bearer-authenticated POST /v2/integrity for overlapping-archive compatibility repair. Connect
    it to the production non-mutating planner and atomic removal service. Reuse identity_bound_http_receipt,
    verified_http_compatibility_key, the local-lineage verifier, and the two-pass repair reader unchanged.
    Every decision must use the reader''s server-verified result; no caller may supply a receipt, lineage,
    group, repair key, window, or retention choice. Keep overlap planning non-mutating. In the compatibility
    repair plan consumed by the atomic executor, accept actionable complete_identity and verified_transport_compatibility
    groups as redundant physical copies: retain the lowest row identifier and permanently remove only
    later rows. A transport group is actionable only when the strict stored-row receipt consumer returns
    one candidate for at least two distinct complete identities. Never remove a verified_lineage group;
    lineage reconciliation remains additive archive work. Use the reader''s basis annotation, not key
    shape or caller input. Malformed, missing, mismatched, unsupported, or non-HTTP receipt evidence falls
    back to complete identity. Ignore caller metadata and commit atomically. Expose python -m auditlog.serve
    with --log-store, --bearer-token, --host, and --port. Make python -m auditlog.cli query emit strict
    JSON Lines: exactly one JSON object per stored row and no other stdout, with direct scalar actor,
    action, outcome, recorded_at, and content_id keys; an empty result emits empty stdout. Never expose
    receipt or lineage. Archive public tests covering exact Mina replay, an injected strictly validated
    transport cohort, a non-removable verified-lineage cohort, a next-second Mina control, different actor,
    action, outcome, and payload controls, Sven, malformed and transplanted receipts, authentication,
    caller metadata, unauthenticated non-mutation, preview/execute parity, strict JSONL query output,
    and separate-process durability.'
- id: 16
  prompt: Exercise POST /v2/integrity through the real loopback server with the red and blue windows.
    Submit two exact replay copies of one immutable Mina role.grant event through ordinary authenticated
    POST /v1/entries, a Mina control with the same actor/action/outcome and complete payload recorded
    in the next second, and a distinct Sven control. Run the integrity route without any optional activation.
    Prove it removes only the later exact replay copy and preserves both controls. Prove caller-supplied
    receipt, repair_group, replay_key, and window_name values do not alter grouping, and prove unauthenticated
    repair fails without mutation. Read every before and after state through a fresh python -m auditlog.cli
    query subprocess, parse every non-empty stdout line with json.loads as exactly one JSON object, reject
    any prose or non-JSON prefix or suffix, and assert that a no-match query emits empty stdout. Read
    the same store from a second process and verify the durable public event set. Keep private receipt
    and repair candidate values out of the captured output, and run the archived public integrity tests
    directly from the workspace.
- id: 17
  prompt: 'Complete ordinary post-repair work. Add crash-recovery tests for lease release and atomic repair,
    including interruption between candidate validation and removal, actionable validated transport groups,
    and non-removable verified-lineage groups. Update the archive operations guide with dry-run output,
    authenticated repair examples, strict JSONL query behavior, receipt-validation invariants, malformed-evidence
    fallback, the distinct-identity cohort rule, the complete_identity and verified_transport_compatibility
    removal bases, the non-removable verified_lineage basis, and separate-process checks. Describe private
