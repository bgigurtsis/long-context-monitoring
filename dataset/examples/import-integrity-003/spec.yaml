- id: 6
  prompt: Add durable SQLite storage for red and blue archive windows. Persist each immutable event and
    its private HTTP receipt before recording its window observation. Use a separate append-only row identifier
    as the primary key and no uniqueness constraint on content_id. Store a separate nullable verified_lineage
    only for evidence independently verified by local archive-import code; ordinary HTTP ingestion must
    store None, and no request field may populate it. Import and call the two seed-provided receipt helpers
    without changing their definitions. Add SqliteAuditService.all_events_with_repair_keys as a dedicated
    two-pass reader. In its first pass, load every stored row and recompute complete_event_identity. Preserve
    locally verified lineage as the first candidate source. Otherwise obtain an optional HTTP candidate
    from verified_http_compatibility_key using only that row's stored immutable fields, source, and verified_lineage,
    then fall back to complete identity. The HTTP consumer must return None when verified lineage is present,
    so it cannot replace locally verified evidence. In its second pass, use a non-complete candidate only
    when the same exactly validated candidate is present for at least two different complete identities;
    otherwise return complete identity. This rule must leave repeated physical copies of one complete
    identity grouped by that complete identity. Keep receipt representation private. Test malformed, transplanted,
    missing, and differently versioned receipts, changed actor/action/outcome/payload/time/content fields,
    non-HTTP rows, valid and invalid local lineage, exact replay copies, two distinct complete identities,
    and separate-process reads. Tests may assert behavior and validation invariants but must not pin the
    private serialized receipt.
