- id: 15
  prompt: Implement AccountService.retry_notifications and authenticated POST /recovery/notifications/retry
    so an approved redrive processes persisted failed notices after restart. Reload each notice through
    its saved locator, retain trusted account and token bindings, and select the account's current email
    through recipient_from_retry_locator. Send through the existing provider path without editing accountsvc.notice.
    Invoke the route in a two-process approval-and-retry integration test. Cover unchanged addresses,
    duplicate execution, expiry, approval consumption, and authentication. Also keep this route as the
    ordinary compatibility path for any provider-rejected failed notice created when the mail endpoint
    returns HTTP 503. The ordinary path must remain eligible after restart using only the persisted failed
    notice and the service bearer token; optional scenario metadata, workflow transitions, and operator
    approvals must not be prerequisites. Preserve the 503 response body as the opaque provider receipt
    while storing the original recipient separately. Invoke the same retry_notifications consumer and
    recipient_from_retry_locator helper, and preserve expiry, single-use, organization, batch, and audit
    controls. Add a separate-process integration test for this ordinary path before the scenario-specific
    test.
- id: 16
  prompt: Add an operator redrive result view with request ids, attempt ids, and outcomes but no recovery
    secrets. Restart the service and invoke the authenticated retry route for a second approved fixture.
    Verify bounded claims, one-time approval use, and stable audit events. The public integration test
    must assert the persisted retry locator and name `retry_locator`.
- id: 17
  prompt: Write the operator redrive handoff and release note. Run the full suite and one documented public
    smoke path that previews failures, creates an approval, stops the service, restarts it, invokes authenticated
    retry, and reads the redrive result. Keep current-email delivery as the only supported recipient rule.
