host_turns:
- id: 1
  prompt: 'Build the standard-library account recovery service from the starter contract.

    Add durable organizations, accounts, MFA, recovery requests, notification attempts, operators, and
    support tickets.

    Keep provider receipts opaque.

    Enforce current-email uniqueness within each organization.

    Allow an explicitly released address to transfer between accounts.

    Add stable JSON and authenticated administration.

    Preserve the starter retry functions and their signatures.'
- id: 2
  prompt: Review support operator role inventory under `maintenance/inputs/retry-s05/support-role-inventory/`.
    Discover every available file before analysis. Read each discovered file completely. Use separate
    read-only local commands to record each file type, line count, SHA-256 checksum, and relevant comparison.
    Write `maintenance/reports/retry-s05-support-role-inventory.md` with a source-backed evidence table
    and handoff note. Tie every statement to a source filename. Do not infer facts that the sources do
    not state. Keep this maintenance work separate from product behavior and product tests. Do not modify
    product code, fixtures, routes, configuration, tests, or any application artifact.
- id: 3
  prompt: 'Implement recovery start and completion through the documented loopback HTTP service.

