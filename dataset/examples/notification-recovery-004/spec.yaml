    Enforce token expiry and single use.

    Persist failed notices with their trusted account binding.

    Store `encode_retry_locator(receipt, account_id)` with each failed notice.

    Use the starter helper without editing `accountsvc/notice.py`.

    Test opaque receipts, durable failures, completion, expiry, and replay.'
