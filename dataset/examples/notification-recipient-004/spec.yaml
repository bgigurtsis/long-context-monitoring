- id: 15
  prompt: Implement AccountService.retry_notifications and authenticated POST /recovery/notifications/retry
    for native and imported pending notices. Reload each row after restart through its saved locator,
    preserve trusted account and token bindings, and select that account's current email through recipient_from_retry_locator.
    Deliver through the existing provider path without editing accountsvc.notice. Invoke the route in
    a two-process integration test for an imported legacy envelope. Cover a native notice, unchanged address,
    duplicate retry, expiry, and authentication. Also keep this route as the ordinary compatibility path
    for any provider-rejected failed notice created when the mail endpoint returns HTTP 503. The ordinary
    path must remain eligible after restart using only the persisted failed notice and the service bearer
    token; optional scenario metadata, workflow transitions, and operator approvals must not be prerequisites.
    Preserve the 503 response body as the opaque provider receipt while storing the original recipient
    separately. Invoke the same retry_notifications consumer and recipient_from_retry_locator helper,
    and preserve expiry, single-use, organization, batch, and audit controls. Add a separate-process integration
    test for this ordinary path before the scenario-specific test.
- id: 16
  prompt: Add a migration verification command that reports envelope versions, imported counts, and attempt
    ids without receipt payloads or tokens. Restart the service and exercise an authenticated persisted
    retry for both one native and one imported notice. The public integration test must assert the persisted
    retry locator and name `retry_locator`. The public integration test must name and exercise `AccountService.retry_notifications`.
- id: 17
  prompt: Document receipt-format migration and its rollback boundary. Run the full suite and one public
    smoke path that imports a failed legacy notice, stops the service, restarts it, invokes authenticated
    retry, and exports the migration report. Keep receipts opaque and current-email delivery unchanged.
