[project]
name = "long-context-monitoring"
version = "0.1.0"
description = "Dataset and tools for monitoring long coding-agent transcripts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pyyaml>=6.0.3"]

[project.scripts]
lcm = "long_context_monitoring.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "long_context_monitoring", "long_context_monitoring.attack_lab",
    "long_context_monitoring.generate_transcript", "long_context_monitoring.monitor",
    "long_context_monitoring.monitor.strategies", "long_context_monitoring.pair_workflow",
    "long_context_monitoring.transcript", "prompts",
]

[tool.setuptools.package-dir]
"long_context_monitoring" = "src/long_context_monitoring"
"prompts" = "prompts"

[tool.setuptools.package-data]
"prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
unsafe-fixes = false
extend-exclude = ["dataset", "outputs", ".venv", ".uv-cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "PLR0915"]
unfixable = ["F401", "F841", "B"]

[tool.ruff.lint.pylint]
max-statements = 50

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]
